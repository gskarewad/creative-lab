<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#010814">
    <title>Ocean Journey - The Abyssal Giant</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        window.addEventListener('error', function(e) {
            console.error('Captured Runtime Error:', e.message, e.filename, e.lineno);
            var b = document.getElementById('runtime-error-banner');
            if (!b) {
                b = document.createElement('div');
                b.id = 'runtime-error-banner';
                b.style.cssText = 'position:fixed;top:10px;left:10px;background:rgba(200,20,20,0.92);color:#fff;padding:8px 12px;font-size:12px;z-index:99999;border-radius:4px;font-family:monospace;';
                document.body.appendChild(b);
            }
            b.textContent = 'Error: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')';
        });
    </script>
</head>
<body>
    <div id="viewport-wrapper">
        <!-- 1920x1080 Stage scaled proportionally to fit any screen -->
        <div id="cinema-stage">
            <!-- WebGL Canvas Container -->
            <div id="canvas-container"></div>

            <!-- Cinematic Vignette & Edge Atmosphere -->
            <div class="cinema-vignette"></div>

            <!-- Letterbox Scope Bars -->
            <div class="letterbox-bar top"></div>
            <div class="letterbox-bar bottom"></div>

            <!-- Documentary Series Watermark -->
            <div class="doc-watermark">
                <span class="doc-series">EARTH ARCHIVES</span>
                <span class="doc-res">4K UHD • 60 FPS</span>
            </div>

            <!-- Documentary Typographic Title Card Overlay -->
            <div id="title-card">
                <div class="title-badge" id="title-badge">SERIES PROLOGUE</div>
                <div class="title-main" id="title-main">OCEAN JOURNEY</div>
                <div class="title-sub" id="title-sub">THE ABYSSAL GIANT</div>
            </div>

            <!-- End Scene Fade to Black -->
            <div id="fade-overlay"></div>

            <!-- Interactive Player Controls Bar -->
            <div id="control-bar">
                <!-- Play / Pause -->
                <button class="ctrl-btn" id="play-btn" title="Play / Pause" aria-label="Play / Pause">
                    <svg id="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    <svg id="play-icon" viewBox="0 0 24 24" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
                </button>

                <!-- Scrubber Slider -->
                <div class="slider-container">
                    <input type="range" id="scrub-slider" min="0" max="1000" value="0" step="1">
                </div>

                <!-- Live Timecode Display -->
                <div id="time-display">00:00.0 / 00:20.0</div>

                <!-- Playback Speed -->
                <button class="ctrl-btn text-btn" id="speed-btn" title="Playback Speed">1x</button>

                <!-- Synthesized Ambient Soundscape Toggle -->
                <button class="ctrl-btn" id="audio-btn" title="Soundscape: Synthesized Ocean Audio">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>

                <!-- Fullscreen -->
                <button class="ctrl-btn" id="fs-btn" title="Fullscreen" aria-label="Fullscreen">
                    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts Bundle (Locally bundled, zero external network dependencies) -->
    <script src="js/three.min.js"></script>
    <script src="js/whale-model.js"></script>
    <script src="js/ocean-environment.js"></script>
    <script src="js/cinematic-director.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
